name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'capacitor.config.json', 'package*.json', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SUPABASE: ${{ secrets.SUPABASE_URL != '' }}
      HAS_KEYSTORE: ${{ secrets.HC_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # Optional: write www/config.js from repository secrets instead of committing it
      - name: Write Supabase config from secrets
        if: env.HAS_SUPABASE == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUBLIC_TRACK_URL: ${{ secrets.PUBLIC_TRACK_URL }}
        run: |
          cat > www/config.js <<JS
          window.HC_CONFIG = {
            SUPABASE_URL: '${SUPABASE_URL}',
            SUPABASE_ANON_KEY: '${SUPABASE_ANON_KEY}',
            PUBLIC_TRACK_URL: '${PUBLIC_TRACK_URL:-https://app.horsecargoltd.com/track.html}',
            PHOTO_BUCKET: 'cargo-photos',
          };
          JS

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HC_KEYSTORE_BASE64: ${{ secrets.HC_KEYSTORE_BASE64 }}
        run: echo "$HC_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/horse-cargo.jks

      - name: Build APKs
        working-directory: android
        env:
          HC_KEYSTORE_PATH: ${{ secrets.HC_KEYSTORE_BASE64 != '' && format('{0}/horse-cargo.jks', runner.temp) || '' }}
          HC_KEYSTORE_PASSWORD: ${{ secrets.HC_KEYSTORE_PASSWORD }}
          HC_KEY_ALIAS: ${{ secrets.HC_KEY_ALIAS }}
          HC_KEY_PASSWORD: ${{ secrets.HC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/horse-cargo-debug-${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: horse-cargo-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

